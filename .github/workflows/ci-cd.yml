name: Numind Admin Web CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      refresh_cache:
        description: '刷新 Docker 缓存'
        type: boolean
        required: false
        default: false

env:
  DOCKERHUB_USERNAME: pmtmyaggy
  IMAGE_NAME: pmtmyaggy/numind-admin-web

jobs:
  # =====================================================
  # 构建并推送镜像
  # =====================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Calculate Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: $IMAGE_TAG"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            IMAGE_TAG="release"
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "::notice::🚀 QA 环境构建: release"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            IMAGE_TAG="develop"
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "::notice::🚀 开发环境构建: develop"
          else
            IMAGE_TAG="latest"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: latest"
          fi

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: ${{ github.event.inputs.refresh_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max

      - name: Notify success
        run: |
          echo "✅ 镜像构建完成"
          echo "镜像: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          echo "环境: ${{ steps.meta.outputs.environment }}"

  # =====================================================
  # 部署到 Dev 环境 (49.233.219.254:9100)
  # =====================================================
  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署 Admin Web 到 Dev 环境..."

            docker stop numind-admin-web-dev 2>/dev/null || true
            docker rm -f numind-admin-web-dev 2>/dev/null || true
            sleep 2

            docker pull ${{ env.IMAGE_NAME }}:develop

            docker run -d \
              --name numind-admin-web-dev \
              --network numind-network \
              -p 9100:80 \
              -e API_PROXY_PASS="http://numind-admin-server-dev:9099/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:develop

            sleep 3
            if curl -sf http://localhost:9100/health > /dev/null 2>&1; then
              echo "✅ Dev 部署完成，健康检查通过"
            else
              echo "⚠️ 健康检查未通过"
              docker logs --tail 10 numind-admin-web-dev
            fi

  # =====================================================
  # 部署到 QA 环境 (49.233.219.254:9101)
  # =====================================================
  deploy_qa:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Deploy to QA Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.233.219.254
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署 Admin Web 到 QA 环境..."

            docker stop numind-admin-web-qa 2>/dev/null || true
            docker rm -f numind-admin-web-qa 2>/dev/null || true
            sleep 2

            docker pull ${{ env.IMAGE_NAME }}:release

            docker run -d \
              --name numind-admin-web-qa \
              --network numind-network \
              -p 9101:80 \
              -e API_PROXY_PASS="http://numind-admin-server-qa:9099/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:release

            sleep 3
            if curl -sf http://localhost:9101/health > /dev/null 2>&1; then
              echo "✅ QA 部署完成，健康检查通过"
            else
              echo "⚠️ 健康检查未通过"
              docker logs --tail 10 numind-admin-web-qa
            fi

  # =====================================================
  # 部署到 Prod 环境 (129.28.125.51:9102)
  # =====================================================
  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to Prod Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.28.125.51
          username: root
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署 Admin Web 到 Prod 环境..."

            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              IMAGE_TAG="${{ github.ref_name }}"
            else
              IMAGE_TAG="latest"
            fi

            docker stop numind-admin-web-prod 2>/dev/null || true
            docker rm -f numind-admin-web-prod 2>/dev/null || true
            sleep 2

            docker pull ${{ env.IMAGE_NAME }}:$IMAGE_TAG

            docker network create numind-network 2>/dev/null || true

            docker run -d \
              --name numind-admin-web-prod \
              --network numind-network \
              -p 9102:80 \
              -e API_PROXY_PASS="http://numind-admin-server-prod:9099/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:$IMAGE_TAG

            sleep 3
            if curl -sf http://localhost:9102/health > /dev/null 2>&1; then
              echo "✅ Prod 部署完成，健康检查通过"
            else
              echo "⚠️ 健康检查未通过"
              docker logs --tail 10 numind-admin-web-prod
            fi
